<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Finalizar Compra</title>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body class="bg-stone-200 flex flex-col h-screen">
        <header
            class="flex text-xl justify-between shadow-xl shadow-slate-400 bg-slate-950 px-8 py-4 sticky top-0 z-10"
        >
            <a href="./">
                <img
                    src="./assets/logo/hashtag.svg"
                    alt="Logo do Magazine Hashtag"
                    class="h-12"
                />
            </a>
        </header>
        <form class="flex w-screen px-5 py-10 gap-4 grow">
            <section id="dados-usuario" class="w-1/3 bg-white rounded-lg py-5">
                <p class="mb-5 text-center font-bold">Seus Dados</p>
                <div class="flex flex-col px-10 py-3">
                    <label for="nome" class="font-bold text-sm mb-2"
                        >Nome:</label
                    >
                    <input
                        type="text"
                        id="nome"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: João Pinheiro"
                        required
                        value="Nilson Carvalho de souza"
                    />
                </div>
                <div class="flex flex-col px-10 py-3">
                    <label for="email" class="font-bold text-sm mb-2"
                        >E-mail:</label
                    >
                    <input
                        type="email"
                        id="email"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: joao.pinheiro@email.com"
                        required
                        value="nilson@email.com"
                    />
                </div>
                <div class="flex flex-col px-10 py-3">
                    <label for="phone" class="font-bold text-sm mb-2"
                        >Telefone de Contato:</label
                    >
                    <input
                        type="tel"
                        id="phone"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: (69) 99978-9767"
                        required
                        value="69999789767"
                    />
                </div>
            </section>
            <section
                id="dados-pagamento"
                class="w-1/3 bg-white rounded-lg py-5"
            >
                <p class="mb-5 text-center font-bold">Pagamento e Entrega</p>
                <div class="flex flex-col px-10 py-3">
                    <label for="numero-cartao" class="font-bold text-sm mb-2"
                        >Número do Cartão:</label
                    >
                    <input
                        type="text"
                        id="numero-cartao"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: 1111 2222 3333 4444"
                        required
                        value="1111 2222 3333 4444"
                    />
                </div>
                <div class="flex">
                    <div class="flex flex-col px-10 py-3 w-1/2">
                        <label for="cvv" class="font-bold text-sm mb-2"
                            >CVV:</label
                        >
                        <input
                            type="number"
                            id="cvv"
                            class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                            placeholder="ex: 222"
                            required
                            value="111"
                        />
                    </div>
                    <div class="flex flex-col px-10 py-3 w-1/2">
                        <label
                            for="data-expiracao"
                            class="font-bold text-sm mb-2"
                            >Data de Validade:</label
                        >
                        <input
                            type="text"
                            id="data-expiracao"
                            class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                            placeholder="ex: 02/32"
                            required
                            value="02/32"
                        />
                    </div>
                </div>
                <div class="flex flex-col px-10 py-3">
                    <label for="cep" class="font-bold text-sm mb-2">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: 11111-222"
                        required
                        value="76804018"
                    />
                </div>
                <div class="flex flex-col px-10 py-3">
                    <label for="endereco" class="font-bold text-sm mb-2"
                        >Endereço:</label
                    >
                    <input
                        type="text"
                        id="endereco"
                        class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                        placeholder="ex: Rua Duque de caxias"
                        required
                        value="Rua Duque de Caxias"
                    />
                </div>
                <div class="flex">
                    <div class="flex flex-col px-10 py-3 w-1/2">
                        <label
                            for="numero-imovel"
                            class="font-bold text-sm mb-2"
                            >Número Imóvel:</label
                        >
                        <input
                            type="text"
                            id="numero-imovel"
                            class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                            placeholder="ex: 12345"
                            value="2386"
                        />
                    </div>
                    <div class="flex flex-col px-10 py-3 w-1/2">
                        <label for="complemento" class="font-bold text-sm mb-2"
                            >Complemento:</label
                        >
                        <input
                            type="text"
                            id="complemento"
                            class="rounded-sm border-2 border-slate-200 px-2 py-1 bg-slate-50"
                            placeholder="ex: Ap 22"
                            required
                            value="Casa"
                        />
                    </div>
                </div>
            </section>
            <section
                id="produtos-checkout"
                class="w-1/3 bg-white rounded-lg py-5"
            >
                <section
                    id="container-produtos-checkout"
                    class="h-4/5 overflow-y-auto px-2"
                ></section>
                <section
                    id="celula-checkout"
                    class="flex flex-col px-2 h-1/5 justify-around"
                >
                    <p
                        id="preco-total-checkout"
                        class="bg-slate-200 text-green-800 rounded-lg pl-5"
                    ></p>
                    <button
                        class="bg-slate-900 text-slate-200 p-1 hover:bg-slate-800 cursor-pointer"
                        type="submit"
                    >
                        Finalizar Compra
                    </button>
                </section>
            </section>
        </form>
        <script type="module" src="./src/checkout.js"></script>
    </body>
</html>
