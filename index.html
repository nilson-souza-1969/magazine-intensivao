<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Magazine Hashtag</title>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body class="bg-stone-200 flex flex-col">
        <section
            id="carrinho"
            class="fixed top-0 -right-90 bg-slate-950 h-screen w-90 text-slate-200 z-50 duration-200 border-l-4 border-slate-200 p-5 flex flex-col justify-between"
        >
            <div id="cabecalho-carrinho" class="flex justify-between m-4">
                <p>Meu Carrinho</p>
                <button id="fechar-carrinho">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <section
                id="produtos-carrinho"
                class="h-3/5 overflow-y-auto flex flex-col gap-2"
            >
                <!-- <article></article> Será gerado dinamicamente a partir de menuCarrinho.js -->
            </section>
            <p
                id="preco-total"
                class="bg-slate-200 text-green-800 rounded-sm pl-5"
            >
                Total: ${}
            </p>
            <button
                id="btn-finalizar-compra"
                class="bg-slate-200 text-slate-900 p-1 hover:bg-slate-900 hover:text-slate-200 cursor-pointer"
            >
                Finalizar Compra
            </button>
        </section>
        <header
            class="flex text-xl justify-between shadow-xl shadow-slate-400 bg-slate-950 px-8 py-4 sticky top-0 z-10"
        >
            <a href="./">
                <img
                    src="./assets/logo/hashtag.svg"
                    alt="Logo do Magazine Hashtag"
                    class="h-12"
                />
            </a>
            <div class="text-slate-200 flex gap-2 items-end mx-2">
                <button id="abrir-carrinho" class="mx-2">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
                <button class="mr-2">
                    <a href="./pedidos.html"
                        ><i class="fa-solid fa-user"></i
                    ></a>
                </button>
            </div>
        </header>
        <main class="flex flex-col items-center">
            <section id="filtros" class="p-10 flex">
                <div class="p-2">
                    <input
                        id="exibir-todos"
                        type="radio"
                        name="filtro"
                        class="peer hidden"
                        checked
                    />
                    <label
                        for="exibir-todos"
                        class="peer-checked:bg-slate-950 peer-checked:text-slate-200 peer-checked:font-bold p-2 rounded-xl select-none cursor-pointer"
                        >Todos</label
                    >
                </div>
                <div class="p-2">
                    <input
                        id="exibir-masculinos"
                        type="radio"
                        name="filtro"
                        class="peer hidden"
                    />
                    <label
                        for="exibir-masculinos"
                        class="peer-checked:bg-slate-950 peer-checked:text-slate-200 peer-checked:font-bold p-2 rounded-xl select-none cursor-pointer"
                        >Masculinos</label
                    >
                </div>
                <div class="p-2">
                    <input
                        id="exibir-femininos"
                        type="radio"
                        name="filtro"
                        class="peer hidden"
                    />
                    <label
                        for="exibir-femininos"
                        class="peer-checked:bg-slate-950 peer-checked:text-slate-200 peer-checked:font-bold p-2 rounded-xl select-none cursor-pointer"
                        >Femininos</label
                    >
                </div>
            </section>
            <section
                id="container-produto"
                class="flex flex-wrap p-10 justify-center gap-10"
            ></section>
        </main>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
